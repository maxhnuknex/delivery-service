version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: delivery-service_delivery-service_db
    environment:
      POSTGRES_USER: delivery-service_user
      POSTGRES_PASSWORD: delivery-service_password
      POSTGRES_DB: delivery-service_delivery-service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery-service_user -d delivery-service_delivery-service"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
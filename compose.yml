services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: delivery-service_user
      POSTGRES_PASSWORD: delivery-service_password
      POSTGRES_DB: delivery-service_delivery-service
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery-service_user -d delivery-service_delivery-service"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    image: golang:alpine
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgres://delivery-service_user:delivery-service_password@postgres:5432/delivery-service_delivery-service?sslmode=disable"
    volumes:
      - ./migrations:/migrations
    command: >
      sh -c "go install github.com/pressly/goose/v3/cmd/goose@latest && goose -dir /migrations up"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgres://delivery-service_user:delivery-service_password@postgres:5432/delivery-service_delivery-service?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

  mock-restaurant:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "8081:8081"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
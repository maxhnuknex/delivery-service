version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-delivery-service_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-delivery-service_password}
      POSTGRES_DB: ${DB_NAME:-delivery-service_delivery-service}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-delivery-service_user} -d ${DB_NAME:-delivery-service_delivery-service}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    image: golang:alpine
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgres://${DB_USER:-delivery-service_user}:${DB_PASSWORD:-delivery-service_password}@postgres:5432/${DB_NAME:-delivery-service_delivery-service}?sslmode=disable"
    volumes:
      - ./migrations:/migrations
    command: >
      sh -c "go install github.com/pressly/goose/v3/cmd/goose@latest && goose -dir /migrations up"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgres://${DB_USER:-delivery-service_user}:${DB_PASSWORD:-delivery-service_password}@postgres:5432/${DB_NAME:-delivery-service_delivery-service}?sslmode=disable"
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

  mock-restaurant:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "${MOCK_PORT:-8081}:8081"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata: